# =============================================================================
#  Cabeçalhos de segurança do FAST
#
#  Precisa ser incluído em TODO location que declare o seu próprio add_header:
#  no nginx, um add_header dentro de um location cancela a herança de todos os
#  add_header dos níveis acima. Sem este include, /assets/ e /index.html sairiam
#  sem HSTS, sem CSP e sem proteção contra clickjacking.
#
#  Instalado em /etc/nginx/snippets/fast-security-headers.conf por
#  deploy/scripts/nginx.sh — não edite lá, edite este arquivo e rode
#  `sudo make nginx`.
# =============================================================================

add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "SAMEORIGIN" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "geolocation=(), microphone=(), camera=(), interest-cohort=()" always;
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'self'; frame-ancestors 'self'" always;
