# =============================================================================
#  Cabeçalhos de segurança vindos do backend — descartados no proxy
#
#  A aplicação emite os próprios cabeçalhos de segurança (backend/src/server.ts)
#  porque atrás de um CDN o bloco HTTPS do nginx não roda. No caminho direto
#  (visitante → nginx HTTPS) os dois emitiriam a mesma coisa e a resposta sairia
#  com CSP e HSTS duplicados. Este include vai em todo location que faz
#  proxy_pass no bloco HTTPS: o nginx passa a ser a única fonte ali.
#
#  Instalado em /etc/nginx/snippets/fast-proxy-hide-security.conf por
#  deploy/scripts/nginx.sh — não edite lá, edite este arquivo e rode
#  `sudo make nginx`.
# =============================================================================

proxy_hide_header Strict-Transport-Security;
proxy_hide_header X-Content-Type-Options;
proxy_hide_header X-Frame-Options;
proxy_hide_header Referrer-Policy;
proxy_hide_header Permissions-Policy;
proxy_hide_header Content-Security-Policy;
proxy_hide_header X-Powered-By;
